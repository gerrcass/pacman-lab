name: CI

on:
  pull_request:
  workflow_dispatch:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # build runs `tsc --noEmit`, so it covers the typecheck too.
      - run: npm run build
      - run: npm run lint
      - run: npm test
      - run: npm run deps
